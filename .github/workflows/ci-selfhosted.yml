name: CI (self-hosted GPU/MPS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  win_cuda:
    name: win-rtx / CUDA
    runs-on: [self-hosted, win-rtx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python info
        shell: powershell
        run: |
          python3 --version
          python3 -c "import sys; print(sys.executable)"

      - name: Clean install test (base_full)
        shell: powershell
        run: |
          .\scripts\test_install.ps1 -Profile base_full

      - name: CUDA smoke
        shell: powershell
        run: |
          python -c "import torch; print('cuda_available=', torch.cuda.is_available()); print('device=', (torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-cuda'))"

  mac_mps:
    name: mac-m4 / MPS
    runs-on: [self-hosted, mac-m4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python info
        shell: bash
        run: |
          python3 --version || true
          python3 --version
          python3 -c "import sys; print(sys.executable)"

      - name: Clean install test (base_full)
        shell: bash
        run: |
          ./scripts/test_install.sh base_full

      - name: MPS smoke
        shell: bash
        run: |
          python3 -c "from src.core.accelerator import accelerator; print('accelerator.device=', accelerator.device); print('torch_available=', accelerator.torch_available)"
