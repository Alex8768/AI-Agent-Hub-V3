name: CI (self-hosted GPU/MPS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win_cuda:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: win-rtx / CUDA
    runs-on: [self-hosted, win-rtx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python info
        shell: powershell
        run: |
          py -0p
          py -3.12 --version
          py -3.12 -c "import sys; print(sys.executable)"


      - name: Clean install test (base_full)
        shell: powershell
        run: |
          # Force Python 3.12 for runner service account (no USERPROFILE paths)
          $env:PATH = "C:\Program Files\Python312;C:\Program Files\Python312\Scripts;$env:PATH"
          python --version
          python -m pip --version
          .\scripts\test_install.ps1 -Profile base_full

      - name: CUDA smoke
        shell: powershell
        run: |
          .\.venv_test_install_base_full\Scripts\python.exe -c "import torch; print('cuda_available=', torch.cuda.is_available()); print('device=', (torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-cuda'))"

  mac_mps:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: mac-m4 / MPS
    runs-on: [self-hosted, mac-m4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python info
        shell: bash
        run: |
          python3 --version || true
          python3 --version
          python3 -c "import sys; print(sys.executable)"

      - name: Clean install test (base_full)
        shell: bash
        run: |
          ./scripts/test_install.sh base_full

      - name: MPS smoke
        shell: bash
        run: |
          ./.venv_test_install_base_full/bin/python -c "from src.core.accelerator import accelerator; print('accelerator.device=', accelerator.device); print('torch_available=', accelerator.torch_available)"
