name: CI (CPU hosted)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  cpu:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
        profile: [base, base_full]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package (profile)
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          if [ "${{ matrix.profile }}" = "base" ]; then
            python -m pip install -e ".[base]"
          else
            python -m pip install -e ".[base,security,embeddings,faiss,ingest,test]"
          fi

      - name: Compile
        shell: bash
        run: |
          python -m compileall src

      - name: Tests
        shell: bash
        run: |
          pytest -q
