name: CI (Pro)

on:
  push:
    branches: [ "pro-v3.1-dev" ]
  pull_request:
    branches: [ "pro-v3.1-dev" ]

jobs:
  release-gate:
    name: ubuntu-latest / py3.12 / release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (test deps)
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Release-gate contract tests
        shell: bash
        run: |
          pytest -q \
            tests/unit/docs/test_docs_topology_quality_gate.py \
            tests/unit/docs/test_api_docs_quality_gate.py \
            tests/unit/docs/test_assistant_runtime_quality_gate.py \
            tests/unit/docs/test_intent_plan_orchestrator_quality_gate.py \
            tests/unit/docs/test_confirmation_handshake_runtime_quality_gate.py \
            tests/unit/docs/test_approval_execution_gateway_runtime_quality_gate.py \
            tests/unit/docs/test_durable_approval_recovery_runtime_quality_gate.py \
            tests/unit/docs/test_controlled_execution_pilot_runtime_quality_gate.py \
            tests/unit/docs/test_llm_planner_runtime_quality_gate.py \
            tests/unit/docs/test_dynamic_tool_selection_runtime_quality_gate.py \
            tests/unit/docs/test_feedback_learning_runtime_quality_gate.py \
            tests/unit/docs/test_feedback_adaptation_runtime_quality_gate.py \
            tests/unit/docs/test_assistant_conversational_recovery_runtime_quality_gate.py \
            tests/unit/docs/test_architecture_hardening_runtime_quality_gate.py \
            tests/unit/docs/test_topology_hardening_runtime_quality_gate.py \
            tests/unit/docs/test_debt_resolution_runtime_quality_gate.py \
            tests/unit/docs/test_planner_decoupling_runtime_quality_gate.py \
            tests/unit/layers/pro/test_reasoning_enterprise_required_checks_matrix.py \
            tests/unit/layers/pro/test_reasoning_enterprise_required_checks_normalizer.py \
            tests/unit/layers/pro/test_reasoning_enterprise_required_checks_consolidation_quality_gate.py \
            tests/unit/layers/pro/test_reasoning_enterprise_required_checks_policy.py \
            tests/unit/layers/pro/test_reasoning_enterprise_release_gate_aggregator.py \
            tests/unit/layers/pro/test_reasoning_enterprise_release_gate_decision.py \
            tests/unit/layers/pro/test_reasoning_enterprise_release_gate_coverage_quality_gate.py \
            tests/unit/layers/pro/test_reasoning_enterprise_productization_quality_gate.py \
            tests/unit/layers/pro/test_reasoning_topology_dependency_quality_gate.py

      - name: Build release-gate report artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.layers.pro.reasoning.enterprise.required_checks_matrix import (
              consolidate_enterprise_required_checks_matrix,
          )
          from src.layers.pro.reasoning.enterprise.required_checks_normalizer import (
              normalize_enterprise_required_checks_by_profile,
          )
          from src.layers.pro.reasoning.enterprise.required_checks_policy import (
              build_enterprise_required_checks_policy,
          )
          from src.layers.pro.reasoning.enterprise.release_gate_aggregator import build_enterprise_release_gate_inputs
          from src.layers.pro.reasoning.enterprise.release_gate_decision import decide_enterprise_release_gate
          from src.layers.pro.reasoning.enterprise.release_gate_model import build_enterprise_release_gate_policy

          diagnostics = {
              "verify": {"status": "pass"},
              "self_check": {"status": "pass"},
              "reasoning_benchmark": {
                  "summary": {
                      "suite_name": "ci-release-gate",
                      "total_cases": 10,
                      "passed_cases": 9,
                      "pass_rate": 0.9,
                      "average_score": 0.9,
                  }
              },
              "coverage": {
                  "line_rate": 0.92,
              },
              "reasoning_optimization": {
                  "decision": {"action": "approve", "requires_human_review": False}
              },
          }
          policy_seed = build_enterprise_required_checks_policy(
              profile_name="enterprise_default",
              required_checks=["verify", "self_check", "reasoning_benchmark", "reasoning_optimization"],
              stable_statuses=["pass"],
              treat_missing_as_failure=True,
              allow_warnings=False,
          )
          workflow_required_checks_by_profile = normalize_enterprise_required_checks_by_profile(
              workflow_definitions={
                  "by_profile": {
                      "enterprise_default": {
                          "checks": ["release-gate", "interface-gate", "search-boundary-gate"],
                      }
                  }
              },
              aliases={
                  "release_gate": ["verify", "self_check", "reasoning_benchmark", "reasoning_optimization"],
                  "interface_gate": ["ui_quality_gate"],
                  "search_boundary_gate": ["search_contract_quality"],
              },
          )
          checks_matrix = consolidate_enterprise_required_checks_matrix(
              policies=[policy_seed],
              workflow_required_checks_by_profile=workflow_required_checks_by_profile,
              blocking_checks_by_profile={"enterprise_default": ["verify", "self_check"]},
              version="v1",
          )
          default_profile = next(
              profile
              for profile in checks_matrix["profiles"]
              if profile["profile_name"] == "enterprise_default"
          )
          policy = build_enterprise_release_gate_policy(
              profile_name=default_profile["profile_name"],
              required_checks=default_profile["required_checks"],
              blocking_checks=default_profile["blocking_checks"],
              minimum_pass_rate=0.8,
              minimum_average_score=0.7,
              minimum_coverage_ratio=0.85,
              allow_skipped=False,
              require_benchmark_summary=True,
              require_optimization_review=True,
              allowed_warning_codes=[],
          )
          inputs = build_enterprise_release_gate_inputs(
              diagnostics=diagnostics,
              warnings=[],
              profile_name="enterprise_default",
          )
          decision = decide_enterprise_release_gate(
              inputs=inputs,
              policy=policy,
              decision_id="ci_release_gate",
          )
          report = {
              "profile_name": policy["profile_name"],
              "required_checks": policy["required_checks"],
              "required_checks_matrix": checks_matrix,
              "release_checks": inputs["release_checks"],
              "coverage_ratio": inputs.get("coverage_ratio"),
              "required_checks_evaluation": inputs["required_checks_evaluation"],
              "decision": decision,
          }
          Path("release-gate-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release-gate report
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: release-gate-report.json
          if-no-files-found: error

  interface-gate:
    name: ubuntu-latest / node20 / interface-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: npm run build

      - name: Run interface quality gate
        shell: bash
        working-directory: frontend
        run: npm run quality-gate

  search-boundary-gate:
    name: ubuntu-latest / py3.12 / search-boundary-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (test deps)
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Run search boundary quality gates
        shell: bash
        run: |
          pytest -q \
            tests/unit/api/test_search_endpoint_contract_quality_gate.py \
            tests/unit/api/test_search_hybrid_endpoint.py \
            tests/unit/api/test_search_mapping_adapters.py \
            tests/unit/services/search/test_search_service_contract_boundary.py \
            tests/unit/services/search/test_search_service_hybrid_stats.py

  qdrant-it:
    name: ubuntu-latest / py3.12 / qdrant-it
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (Pro deps)
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          # Deterministic install: integration tests require qdrant + embeddings/faiss.
          python -m pip install -e ".[test,qdrant,embeddings,faiss]"

      - name: Compile
        shell: bash
        run: |
          python -m compileall src

      - name: Wait for Qdrant
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:6333/healthz" >/dev/null 2>&1; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready in time"
          curl -v "http://localhost:6333/healthz" || true
          exit 1

      - name: Run Qdrant integration tests
        shell: bash
        env:
          RUN_QDRANT_IT: "1"
          QDRANT_HOST: "localhost"
          QDRANT_PORT: "6333"
        run: |
          pytest -q tests/integration/test_qdrant_integration.py tests/integration/test_memory_semantic_integration.py
