name: CI

on:
  push:
    branches: [ main, pro-v3.1-dev ]
    tags: [ "*" ]
  pull_request:

jobs:
  tests-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with mcp extra)
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[test,mcp]"
      - name: MCP smoke tests
        run: |
          pytest -q tests/unit/mcp/test_mcp_filesystem_server_smoke.py
