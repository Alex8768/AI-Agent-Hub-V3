name: CI

on:
  push:
    branches: [ main, pro-v3.1-dev ]
    tags: [ "*" ]
  pull_request:

jobs:
  tests-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[test,embeddings,faiss]"
      - name: Tests
        run: |
          pytest -q

  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[test,embeddings,faiss]"
      - name: Tests
        run: |
          pytest -q
