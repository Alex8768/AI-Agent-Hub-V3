[project]
name = "ai-agent-hub-v3"
version = "3.1.0-dev.0"
description = "Enterprise AI Agent Platform - ARCHITECTURE_V3 Implementation"
readme = "README.md"
requires-python = ">=3.12,<3.14"  # ⚠️ Ограничение для совместимости M4
license = {text = "MIT"}
authors = [
    {name = "AI Agent Hub Team", email = "team@ai-agent-hub.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core Framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",

    # Async & IO
    "anyio>=4.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",

    # DB / storage (Base)
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",

    # Local LLM / routing (Base)
    "ollama>=0.1.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.22",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "langchain-ollama>=0.1.0",
    "litellm>=1.0.0",

    # Cloud LLM Providers (Base)
    "openai>=1.3.0",
    "anthropic>=0.8.0",
    "google-generativeai>=0.3.0",

    # Utilities
    "rich>=13.0.0",
    "click>=8.1.0",
    "typer>=0.9.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
security = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.0",
]
cache_redis = [
    "redis>=5.0.0",
]
db_postgres = [
    "asyncpg>=0.29.0",
]
graph = [
    "networkx>=3.1",
    "py2neo>=2021.2.3",
]
ingest = [
    "markitdown>=0.1.5b1",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "pdf2image>=1.16.3",
    "unstructured>=0.10.30",
    "tiktoken>=0.5.1",
]
chroma = [
    "chromadb>=0.4.18",
]
qdrant = [
    "qdrant-client>=1.6.0",
]
faiss = [
    "faiss-cpu>=1.8.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
]
base = [
    # Meta-extra for base install; kept empty intentionally.
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "ipython>=8.15.0",
    "jupyter>=1.0.0",
    "debugpy>=1.6.0",
]

mcp = [
    "mcp>=1.0.0",
    "mcp[cli]>=1.0.0",
]

monitoring = [
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

# 🍏 ДЛЯ APPLE SILICON (M1/M2/M3/M4) - АКТИВИРОВАТЬ ТОЛЬКО НА MAC
apple_silicon = [
    "torch>=2.2.0",               # ⚡ Автоматически использует MPS (Metal Performance Shaders)
    "torchvision>=0.17.0",        # Для компьютерного зрения
    "torchaudio>=2.2.0",          # Для аудиообработки
    # PyTorch сам определит устройство MPS на вашем M4
]

# ⚠️ СЕРВЕРНЫЕ GPU-ЗАВИСИМОСТИ - АКТИВИРОВАТЬ ТОЛЬКО НА LINUX С NVIDIA
# 🚫 НЕ ИСПОЛЬЗОВАТЬ НА MACBOOK M4 - вызовет конфликты!
# gpu = [
#     "faiss-gpu>=1.7.2",         # ❌ Только для CUDA/NVIDIA на Linux
#     "torch>=2.1.0",             # ❌ Без MPS поддержки
#     "torchvision>=0.16.0",      # ❌ Используйте apple_silicon вместо этого
# ]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.11.0",
    "faker>=19.0.0",
    "freezegun>=1.2.0",
]

[project.scripts]
ai-agent-hub = "src.cli.main:app"
ai-agent-server = "src.api.main:run_server"

[project.urls]
Homepage = "https://ai-agent-hub.com"
Documentation = "https://docs.ai-agent-hub.com"
Repository = "https://github.com/ai-agent-hub/v3"
Issues = "https://github.com/ai-agent-hub/v3/issues"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]  # asserts in tests are fine

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short -p no:warnings"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "**/tests/**",
    "**/__pycache__/**",
    "**/*_test.py",
    "**/test_*.py",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"